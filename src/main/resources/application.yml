server:
  port: 9090   # 원하는 포트 번호
  error:
    whitelabel:
      enabled: false   # 기본 Whitelabel Error Page 비활성화
    path: /error       # 에러 시 보여줄 경로
logging:
  file:
    name: logs/spring-boot.log
  level:
    root: INFO
    com.chihyunglee: DEBUG
spring:
  mvc:
    view:
      prefix: /WEB-INF/views/   # JSP 등 뷰 파일 위치
      suffix: .jsp              # 뷰 파일 확장자
  mail:
    host: smtp.gmail.com
    port: 587
    username: eno7135@gmail.com
    password: ${SPRING_MAIL_PASSWORD:}   # 구글 앱 비밀번호 (환경변수, 없으면 메일 발송만 실패)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spring_playground}  # DB URL (기본값: 로컬)
    username: ${SPRING_DATASOURCE_USERNAME:myuser}  # DB 계정 (기본값: 로컬)
    password: ${SPRING_DATASOURCE_PASSWORD}         # DB 비밀번호 (환경변수 필수, 기본값 없음)
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  s3:
    bucket: spring-playground-files-chihyung
    region: ap-northeast-2